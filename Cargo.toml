[package]
name = "terraform-settings-mapper"
version = "0.1.0"
edition = "2024"
description = "Fetch Terraform remote state and reconstruct full resource blocks as .tf code"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
